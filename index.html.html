<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quick Notes</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Noto Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .25s ease-out; }
</style>
</head>
<body class="min-h-screen bg-stone-50 text-stone-800 antialiased">
  <main class="mx-auto max-w-xl px-5 py-12 sm:py-16">

    <header class="mb-8">
      <div class="flex items-center gap-2 text-sm font-medium text-emerald-600">
        <span class="inline-block h-2 w-2 rounded-full bg-emerald-500"></span> Quick Notes
      </div>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight">จดอะไรดี วันนี้?</h1>
      <p class="mt-1 text-stone-500">บันทึกข้อความสั้น ๆ ได้ทันที</p>
    </header>

    <!-- Form -->
    <div class="rounded-2xl border border-stone-200 bg-white p-2 shadow-sm focus-within:border-emerald-400 focus-within:ring-4 focus-within:ring-emerald-100 transition">
      <div class="flex items-center gap-2">
        <input id="noteInput" type="text" maxlength="280" autocomplete="off"
          placeholder="พิมพ์ข้อความของคุณที่นี่..."
          class="flex-1 bg-transparent px-3 py-2.5 text-base placeholder-stone-400 focus:outline-none">
        <button id="saveBtn" type="button"
          class="rounded-xl bg-emerald-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition hover:bg-emerald-700 active:scale-95 disabled:cursor-not-allowed disabled:opacity-50">
          บันทึก
        </button>
      </div>
    </div>
    <p id="status" class="mt-2 min-h-[1.25rem] px-1 text-sm text-stone-500"></p>

    <!-- List -->
    <section class="mt-8">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-stone-400">รายการล่าสุด</h2>
        <button id="refreshBtn" type="button" class="text-sm text-stone-400 transition hover:text-emerald-600">รีเฟรช</button>
      </div>
      <ul id="notesList" class="space-y-3"></ul>
    </section>

    <footer class="mt-12 text-center text-xs text-stone-400">Powered by Supabase</footer>
  </main>

<script>
  // ---- Supabase config ----
  const SUPABASE_URL = 'https://igdnsndyvhmyypmllfnp.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnZG5zbmR5dmhteXlwbWxsZm5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NDc4MDcsImV4cCI6MjEwODAyMzgwN30.2dKMH7EHiYpWFy0bkqkGOGUp9Gm6IKachGMFf7q3k8I';
  // Custom fetch: แปลง Headers object เป็น plain object
  // (แก้ DataCloneError เมื่อรันในสภาพแวดล้อมที่ proxy fetch ผ่าน postMessage เช่น artifact preview)
  const safeFetch = (url, options = {}) => {
    const opts = { ...options };
    if (opts.headers instanceof Headers) {
      opts.headers = Object.fromEntries(opts.headers.entries());
    }
    return fetch(typeof url === 'string' ? url : String(url), opts);
  };

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { fetch: safeFetch }
  });

  const input = document.getElementById('noteInput');
  const saveBtn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('notesList');
  const refreshBtn = document.getElementById('refreshBtn');

  function setStatus(msg, type) {
    statusEl.textContent = msg || '';
    statusEl.className = 'mt-2 min-h-[1.25rem] px-1 text-sm ' +
      (type === 'error' ? 'text-rose-500' : type === 'ok' ? 'text-emerald-600' : 'text-stone-500');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('th-TH', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function renderEmpty(text) {
    listEl.innerHTML = '<li class="rounded-2xl border border-dashed border-stone-200 bg-white/60 px-5 py-10 text-center text-stone-400">' + text + '</li>';
  }

  async function loadNotes() {
    listEl.innerHTML = '<li class="py-8 text-center text-stone-400">กำลังโหลด...</li>';
    const { data, error } = await db
      .from('quick_notes')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) {
      renderEmpty('โหลดข้อมูลไม่สำเร็จ');
      setStatus('โหลดไม่สำเร็จ: ' + error.message, 'error');
      return;
    }
    if (!data.length) { renderEmpty('ยังไม่มีโน้ต เริ่มจดอันแรกได้เลย'); return; }

    listEl.innerHTML = data.map(n => `
      <li class="pop rounded-2xl border border-stone-200 bg-white px-5 py-4 shadow-sm">
        <p class="whitespace-pre-wrap break-words text-stone-800">${escapeHtml(n.content)}</p>
        <p class="mt-2 text-xs text-stone-400">${formatDate(n.created_at)}</p>
      </li>`).join('');
  }

  async function saveNote() {
    const content = input.value.trim();
    if (!content) { setStatus('กรุณาพิมพ์ข้อความก่อนบันทึก', 'error'); input.focus(); return; }

    saveBtn.disabled = true;
    setStatus('กำลังบันทึก...');
    const { error } = await db.from('quick_notes').insert({ content });
    saveBtn.disabled = false;

    if (error) { setStatus('บันทึกไม่สำเร็จ: ' + error.message, 'error'); return; }
    input.value = '';
    setStatus('บันทึกแล้ว ✓', 'ok');
    setTimeout(() => setStatus(''), 2000);
    loadNotes();
  }

  saveBtn.addEventListener('click', saveNote);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') saveNote(); });
  refreshBtn.addEventListener('click', loadNotes);
  loadNotes();
</script>
</body>
</html>
